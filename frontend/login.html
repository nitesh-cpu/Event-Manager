<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - College Event Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">

    <header class="header">
        <div class="container header-content">
            <a href="index.html" class="logo">
                <i class="fa-solid fa-calendar-check logo-icon"></i>
                <div class="logo-text">
                    <h1>Event Manager</h1>
                    <p>College Event System</p>
                </div>
            </a>
            <ul class="nav-links" id="navLinks"></ul>
            <div class="header-actions" id="headerActions"></div>
        </div>
    </header>

    <div class="mobile-nav" id="mobileNav">
        <div class="mobile-nav-header">
            <h3>Menu</h3>
            <button style="background: none; border: none; font-size: 1.5rem; cursor: pointer;" id="closeMobileNav">&times;</button>
        </div>
        <ul class="mobile-nav-links" id="mobileNavLinks"></ul>
    </div>

    <main class="main-content">
        <div class="container">
            <div id="alertContainer" class="messages-container"></div>

            <div class="form-container">
                <div class="form-card">
                    <h2><i class="fa-solid fa-right-to-bracket" style="color: var(--primary-color);"></i> Account Login</h2>
                    <p class="subtitle">Welcome back! Log in to manage or register for events.</p>

                    <div id="formErrors"></div>

                    <form id="loginForm">
                        <div class="form-group">
                            <label for="username">Username</label>
                            <input type="text" id="username" class="form-control" placeholder="Enter your username" required autofocus>
                        </div>

                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
                        </div>

                        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 15px;"><i class="fa-solid fa-right-to-bracket"></i> Login</button>
                    </form>

                    <p style="text-align: center; margin-top: 20px; font-size: 0.9rem; color: var(--gray-color);">
                        Don't have an account? <a href="register.html" style="color: var(--primary-color); font-weight: 600;">Register here</a>
                    </p>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="copyright">&copy; 2026 College Event Manager. All rights reserved.</div>
        </div>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.getElementById('loginForm').onsubmit = async function (e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            const res = await apiRequest('/login/', 'POST', { username, password });
            if (res.ok) {
                window.location.href = 'index.html';
            } else {
                showFormErrors(res.data?.detail || 'Invalid username or password.');
            }
        };
    </script>
</body>
</html>
