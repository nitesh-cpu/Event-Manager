<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Event - College Event Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="edit-event">

    <header class="header">
        <div class="container header-content">
            <a href="index.html" class="logo">
                <i class="fa-solid fa-calendar-check logo-icon"></i>
                <div class="logo-text">
                    <h1>Event Manager</h1>
                    <p>College Event System</p>
                </div>
            </a>
            <ul class="nav-links" id="navLinks"></ul>
            <div class="header-actions" id="headerActions"></div>
        </div>
    </header>

    <div class="mobile-nav" id="mobileNav">
        <div class="mobile-nav-header">
            <h3>Menu</h3>
            <button style="background: none; border: none; font-size: 1.5rem; cursor: pointer;" id="closeMobileNav">&times;</button>
        </div>
        <ul class="mobile-nav-links" id="mobileNavLinks"></ul>
    </div>

    <main class="main-content">
        <div class="container">
            <div id="alertContainer" class="messages-container"></div>

            <div class="form-container">
                <div class="form-card">
                    <h2><i class="fa-solid fa-pen-to-square" style="color: var(--primary-color);"></i> Edit Event</h2>
                    <p class="subtitle">Update event details.</p>

                    <div id="formErrors"></div>

                    <form id="editEventForm">
                        <div class="form-group">
                            <label for="title">Event Title</label>
                            <input type="text" id="title" class="form-control" placeholder="Event Title" required>
                        </div>

                        <div class="form-group">
                            <label for="description">Description</label>
                            <textarea id="description" class="form-control" rows="4" placeholder="Describe your event..." required></textarea>
                        </div>

                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                            <div class="form-group">
                                <label for="date">Event Date</label>
                                <input type="date" id="date" class="form-control" required>
                            </div>

                            <div class="form-group">
                                <label for="time">Start Time</label>
                                <input type="time" id="time" class="form-control" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="location">Location / Venue</label>
                            <input type="text" id="location" class="form-control" placeholder="Venue / Location" required>
                        </div>

                        <div style="display: flex; gap: 15px; margin-top: 30px;">
                            <button type="submit" class="btn btn-primary" style="flex: 1; justify-content: center;"><i class="fa-solid fa-save"></i> Save Changes</button>
                            <a href="index.html" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="copyright">&copy; 2026 College Event Manager. All rights reserved.</div>
        </div>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/events.js"></script>
</body>
</html>
