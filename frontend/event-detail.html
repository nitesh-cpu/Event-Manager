<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Details - College Event Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="event-detail">

    <header class="header">
        <div class="container header-content">
            <a href="index.html" class="logo">
                <i class="fa-solid fa-calendar-check logo-icon"></i>
                <div class="logo-text">
                    <h1>Event Manager</h1>
                    <p>College Event System</p>
                </div>
            </a>
            <ul class="nav-links" id="navLinks"></ul>
            <div class="header-actions" id="headerActions"></div>
        </div>
    </header>

    <div class="mobile-nav" id="mobileNav">
        <div class="mobile-nav-header">
            <h3>Menu</h3>
            <button style="background: none; border: none; font-size: 1.5rem; cursor: pointer;" id="closeMobileNav">&times;</button>
        </div>
        <ul class="mobile-nav-links" id="mobileNavLinks"></ul>
    </div>

    <main class="main-content">
        <div class="container">
            <div id="alertContainer" class="messages-container"></div>
            <div id="eventDetailContainer">
                <div style="text-align: center; padding: 50px;">
                    <i class="fa-solid fa-spinner fa-spin fa-2x" style="color: var(--primary-color);"></i>
                    <p style="margin-top: 10px;">Loading event details...</p>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="copyright">&copy; 2026 College Event Manager. All rights reserved.</div>
        </div>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/events.js"></script>
</body>
</html>
